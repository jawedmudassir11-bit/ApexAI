<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>ApexAI | Intelligence Workspace</title>
  <meta name="description" content="ApexAI is a high-performance local browser AI assistant for coding, math, and analysis." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">

  <style>
    :root {
      --bg-main: #0a0b0d;
      --bg-sidebar: #111317;
      --bg-panel: #16191f;
      --accent-glow: #7c4dff;
      --accent-success: #00e676;
      --accent-danger: #ff5252;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f1f3f5;
      --text-muted: #98a2b3;
    }

    /* Light Theme */
    body.theme-light {
      --bg-main: #f8f9fa;
      --bg-sidebar: #ffffff;
      --bg-panel: #f1f3f5;
      --accent-glow: #6200ea;
      --border-color: rgba(0, 0, 0, 0.1);
      --text-main: #212529;
      --text-muted: #495057;
    }

    /* Neon Theme */
    body.theme-neon {
      --bg-main: #050014;
      --bg-sidebar: #0a0026;
      --bg-panel: #150030;
      --accent-glow: #ff00ff;
      --accent-success: #00ffff;
      --border-color: rgba(255, 0, 255, 0.3);
      --text-main: #ffffff;
      --text-muted: #00ffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; height: 100dvh; overflow: hidden; display: flex;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main); -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    input, textarea, select { font-size: 16px !important; }

    /* Custom Logo Styling */
    .logo-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 14px rgba(var(--accent-glow), 0.3); }
    .welcome-logo { width: 120px; height: 120px; border-radius: 24px; object-fit: cover; box-shadow: 0 8px 32px rgba(var(--accent-glow), 0.4); margin: 0 auto; }

    /* Overlays */
    #dropOverlay { display: none; position: fixed; inset: 0; background: rgba(10, 11, 13, 0.95); z-index: 1000; place-items: center; color: var(--accent-glow); font-size: 24px; font-weight: 600; border: 4px dashed var(--accent-glow); pointer-events: none; }
    body.drag-active #dropOverlay { display: grid; }
    #mobileOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; opacity: 0; transition: opacity 0.3s; }

    /* Layout Elements */
    #mobileHeader { display: none; background: var(--bg-sidebar); padding: max(12px, env(safe-area-inset-top)) 20px 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); z-index: 50; }
    #menuToggle { background: transparent; border: 1px solid var(--accent-glow); color: var(--accent-glow); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }

    #sidebar { width: 280px; min-width: 280px; padding: 24px 20px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; z-index: 100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    
    /* New Snippet Panel */
    #snippetPanel { position: fixed; right: -320px; top: 0; bottom: 0; width: 320px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); z-index: 200; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
    #snippetPanel.open { right: 0; }
    .snippet-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .snippet-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; cursor: pointer; transition: border-color 0.2s; }
    .snippet-card:hover { border-color: var(--accent-glow); }
    .snippet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .snippet-title { font-weight: 600; font-size: 13px; color: var(--text-main); }
    .snippet-del { color: var(--accent-danger); cursor: pointer; font-size: 12px; background: none; border: none; padding: 0; }
    .snippet-code { font-family: monospace; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Live Preview Modal */
    #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; padding: 40px; }
    #previewModal.open { display: flex; flex-direction: column; }
    .preview-header { display: flex; justify-content: space-between; background: var(--bg-sidebar); padding: 12px 20px; border-radius: 12px 12px 0 0; border: 1px solid var(--border-color); border-bottom: none; }
    #closePreview { background: var(--accent-danger); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    #previewFrame { flex: 1; width: 100%; background: white; border: none; border-radius: 0 0 12px 12px; }

    /* Branding & Common */
    .brand { display: flex; align-items: center; gap: 12px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 18px; font-weight: 600; }
    .muted { color: var(--text-muted); font-size: 13px; line-height: 1.5; }
    
    .panel { padding: 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-panel); }
    .status-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #status { color: var(--accent-success); font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .progress { height: 4px; overflow: hidden; border-radius: 2px; background: rgba(128, 128, 128, 0.2); }
    #progressBar { width: 0%; height: 100%; background: var(--accent-glow); transition: width 0.3s; }

    /* Controls */
    .sidebar-controls { display: flex; flex-direction: column; gap: 10px; }
    .custom-select { width: 100%; padding: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; cursor: pointer; font-size: 13px; }
    #customPersonaInput { width: 100%; padding: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 13px; resize: vertical; min-height: 60px; display: none; }
    .btn-primary { background: var(--accent-glow); color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px; transition: background 0.2s; }
    .btn-secondary:hover { background: rgba(128,128,128,0.1); }

    /* Sessions */
    #sessionList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
    #sessionList::-webkit-scrollbar { width: 4px; }
    #sessionList::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 2px; }
    .session-item { padding: 12px; border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--text-muted); transition: background 0.2s, color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-item:hover { background: rgba(128,128,128,0.1); color: var(--text-main); }
    .session-item.active { background: rgba(124, 77, 255, 0.15); color: var(--text-main); border: 1px solid rgba(124, 77, 255, 0.3); }

    .action-row { display: flex; gap: 8px; }
    .action-row button { flex: 1; }
    #clearBtn { border-color: rgba(255, 82, 82, 0.3); color: var(--accent-danger); }
    #clearBtn:hover { background: rgba(255, 82, 82, 0.1); }

    .signature-badge { padding-top: 14px; border-top: 1px solid rgba(128, 128, 128, 0.2); text-align: center; padding-bottom: env(safe-area-inset-bottom); }
    .signature-badge p { font-size: 11px; color: var(--text-muted); }

    /* Main Chat Space */
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-main); height: 100%; position: relative; transition: background 0.3s; }
    #openSnippetsBtn { position: absolute; top: 20px; right: 20px; z-index: 40; padding: 8px 12px; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); cursor: pointer; font-size: 13px; }

    #chatbox { flex: 1; width: min(100%, 840px); margin: 0 auto; padding: 32px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    #chatbox::-webkit-scrollbar { width: 4px; }
    #chatbox::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 2px; }

    .welcome { margin: auto; max-width: 520px; text-align: center; display: grid; gap: 16px; }
    .welcome h2 { font-size: clamp(24px, 6vw, 32px); font-weight: 700; letter-spacing: -0.5px; }
    .prompts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .prompt { padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); background: var(--bg-panel); cursor: pointer; text-align: left; font-size: 13px; transition: border-color 0.2s, background 0.2s; }

    /* Messages */
    .msg-container { display: flex; flex-direction: column; max-width: min(92%, 740px); width: fit-content; }
    .msg-container.user { align-self: flex-end; }
    .msg-container.bot { align-self: flex-start; width: 100%; }

    .msg { padding: 4px 0; overflow-wrap: anywhere; line-height: 1.6; font-size: 15px; }
    .user .msg { background: var(--bg-panel); padding: 12px 18px; border-radius: 16px 16px 2px 16px; border: 1px solid var(--border-color); }
    .error { color: #ff5252; border-color: rgba(255, 82, 82, 0.2); background: rgba(255, 82, 82, 0.05); padding: 12px 16px; border-radius: 8px; }

    .msg-actions { align-self: flex-end; display: flex; gap: 8px; margin-top: 4px; }
    .edit-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: color 0.2s; }
    .edit-btn:hover { color: var(--accent-glow); }
    .generation-stats { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-family: monospace; }

    /* Code Blocks */
    .code-wrapper { position: relative; margin: 12px 0; }
    .code-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10; }
    .code-btn { background: rgba(128,128,128,0.2); border: 1px solid rgba(128,128,128,0.3); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .code-btn:hover { background: rgba(128,128,128,0.4); }
    .preview-btn { background: rgba(124, 77, 255, 0.2); border-color: rgba(124, 77, 255, 0.4); color: var(--text-main); }
    
    .msg pre { background: var(--bg-panel); padding: 16px; padding-top: 44px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-color); margin: 0; }
    .msg code { font-family: "SFMono-Regular", Consolas, monospace; background: rgba(128, 128, 128, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    .msg pre code { background: transparent; padding: 0; }

    /* Input Area */
    #inputArea { padding: 0 24px 32px; background: linear-gradient(transparent, var(--bg-main) 30%); }
    .input-wrap { width: min(100%, 800px); margin: 0 auto; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 16px; display: flex; align-items: flex-end; gap: 12px; background: var(--bg-sidebar); }
    .input-wrap:focus-within { border-color: rgba(124, 77, 255, 0.5); box-shadow: 0 0 0 1px rgba(124, 77, 255, 0.2); }

    #userInput { flex: 1; min-width: 0; height: 26px; max-height: 150px; border: 0; outline: 0; color: var(--text-main); background: transparent; resize: none; font-family: inherit; line-height: 26px; }
    #userInput::placeholder { color: var(--text-muted); }

    .action-icon-btn { width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: color 0.2s, background 0.2s; }
    .action-icon-btn:hover { color: var(--text-main); background: rgba(128,128,128,0.1); }
    .action-icon-btn.listening { color: var(--accent-danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    #sendBtn { width: 32px; height: 32px; min-width: 32px; border: 0; border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer; background: var(--accent-glow); display: grid; place-items: center; margin-bottom: -2px; transition: background 0.2s; }
    #sendBtn.stop-mode { background: var(--accent-danger); border-radius: 50%; }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #mobileHeader { display: flex; }
      #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
      #sidebar.open { transform: translateX(0); }
      #mobileOverlay.open { display: block; opacity: 1; }
      #snippetPanel { width: 100%; right: -100%; }
      #previewModal { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); }
      #chatbox { padding: 20px 16px; }
      .prompts { grid-template-columns: 1fr; }
      #inputArea { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>

<body>
  <div id="dropOverlay">Drop file to read contents</div>
  <div id="mobileOverlay"></div>

  <div id="previewModal">
    <div class="preview-header">
      <h3 style="margin:0; font-size:16px;">Live HTML Preview</h3>
      <button id="closePreview">Close</button>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
  </div>

  <header id="mobileHeader">
    <div class="brand">
      <img src="logo.png" class="logo-img" alt="ApexAI Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2M0ZGZmIi8+PHRleHQgeD0iMjAiIHk9IjI2IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4='">
      <h1 style="font-size: 16px;">ApexAI</h1>
    </div>
    <button id="menuToggle">Menu</button>
  </header>

  <aside id="sidebar">
    <div class="brand">
      <img src="logo.png" class="logo-img" alt="ApexAI Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2M0ZGZmIi8+PHRleHQgeD0iMjAiIHk9IjI2IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4='">
      <div>
        <h1>ApexAI</h1>
        <p class="muted" style="font-size: 12px;">Local Compute Kernel</p>
      </div>
    </div>

    <div class="panel">
      <div class="status-container">
        <div id="status">INITIALIZING</div>
      </div>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </div>

    <div class="sidebar-controls">
      <button id="newChatBtn" class="btn-primary">＋ New Session</button>
      
      <select id="themeSelect" class="custom-select">
        <option value="dark">🌙 Dark Theme</option>
        <option value="light">☀️ Light Theme</option>
        <option value="neon">⚡ Neon Theme</option>
      </select>

      <select id="personaSelect" class="custom-select">
        <option value="default">🧠 Analyst (Default)</option>
        <option value="coder">💻 Developer Mode</option>
        <option value="creative">🎨 Creative Mode</option>
        <option value="custom">⚙️ Custom Persona</option>
      </select>
      <textarea id="customPersonaInput" placeholder="Type custom instructions here..."></textarea>
    </div>

    <div id="sessionList"></div>

    <div class="action-row">
      <button id="exportBtn" class="btn-secondary">Export Chat</button>
      <button id="clearBtn" class="btn-secondary">Delete</button>
    </div>

    <div class="signature-badge">
      <p>Made by <strong>Mudassir Jawed</strong></p>
    </div>
  </aside>

  <aside id="snippetPanel">
    <div class="preview-header" style="background:transparent; border:none; padding:0;">
      <h2 style="margin:0; font-size:18px;">Saved Snippets</h2>
      <button id="closeSnippetsBtn" class="btn-secondary" style="border:none; padding:4px;">✕</button>
    </div>
    <button id="saveNewSnippetBtn" class="btn-secondary">+ Save Current Input</button>
    <div class="snippet-list" id="snippetList"></div>
  </aside>

  <main id="main">
    <button id="openSnippetsBtn">‹ Snippets</button>

    <section id="chatbox">
      </section>

    <div id="inputArea">
      <div class="input-wrap">
        <button id="micBtn" class="action-icon-btn" title="Voice Input">🎤</button>
        <textarea id="userInput" placeholder="Type, /fetch URL, or drop a file..." rows="1" disabled></textarea>
        <button id="sendBtn" type="button" disabled>➤</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    import { get, set, del } from "https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm";

    // PWA Manifest
    const manifest = {
      name: "ApexAI Workspace", short_name: "ApexAI", display: "standalone",
      background_color: "#0a0b0d", theme_color: "#0a0b0d",
      icons: [{ src: "logo.png", sizes: "512x512", type: "image/png" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

    // FAST 1B MODEL FOR STABILITY
    const modelId = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
    let engine = null; let ready = false; let generating = false; let stopRequested = false;

    const welcomeHTML = `
      <div class="welcome" id="welcome">
        <img src="logo.png" class="welcome-logo" alt="ApexAI Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2M0ZGZmIi8+PHRleHQgeD0iMjAiIHk9IjI2IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4='">
        <h2>Intelligent Workspace</h2>
        <p class="muted">Run analysis, write code, and process files live.</p>
        <div class="prompts">
          <button class="prompt">Create a simple HTML button</button>
          <button class="prompt">Write a Python script for file sorting</button>
          <button class="prompt">/fetch https://en.wikipedia.org/wiki/Artificial_intelligence</button>
        </div>
      </div>`;

    const CREATOR_RULE = "If asked who made you, created you, your founder, or developer, you must answer explicitly and concisely: 'Mudassir Jawed'. Do not mention other entities.";
    const personas = {
      default: "You are ApexAI, a professional analytical intelligence agent. Provide precise solutions. " + CREATOR_RULE,
      coder: "You are ApexAI, an expert software engineer. Focus entirely on clean, robust code. " + CREATOR_RULE,
      creative: "You are ApexAI, a creative brainstorming assistant. Be expansive and conversational. " + CREATOR_RULE
    };

    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const themeSelect = document.getElementById("themeSelect");
    const personaSelect = document.getElementById("personaSelect");
    const customPersonaInput = document.getElementById("customPersonaInput");

    // ---- Themes ----
    const savedTheme = localStorage.getItem('apexai-theme') || 'dark';
    themeSelect.value = savedTheme;
    if(savedTheme !== 'dark') document.body.className = `theme-${savedTheme}`;

    themeSelect.addEventListener('change', (e) => {
      document.body.className = e.target.value === 'dark' ? '' : `theme-${e.target.value}`;
      localStorage.setItem('apexai-theme', e.target.value);
    });

    // ---- Voice Dictation ----
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null; let isListening = false;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition(); recognition.continuous = false; recognition.interimResults = false;
      recognition.onstart = () => { isListening = true; micBtn.classList.add("listening"); };
      recognition.onresult = (e) => { input.value += (input.value ? " " : "") + e.results[0][0].transcript; input.dispatchEvent(new Event('input')); };
      recognition.onerror = () => stopListening(); recognition.onend = () => stopListening();
    } else { micBtn.style.display = 'none'; }
    micBtn.addEventListener('click', () => { if(!recognition) return; isListening ? recognition.stop() : recognition.start(); });
    function stopListening() { isListening = false; micBtn.classList.remove("listening"); }

    // ---- IndexedDB Memory Management ----
    let sessions = {}; let currentId = null;

    async function initDatabase() {
      sessions = await get('apexai-sessions') || {};
      currentId = localStorage.getItem('apexai-current-id');
      if (!currentId || !sessions[currentId]) await createNewSession();
      renderSessionList(); loadSessionToUI();
    }

    async function createNewSession() {
      currentId = Date.now().toString();
      sessions[currentId] = { title: "New Chat", messages: [], persona: 'default', customPrompt: '' };
      await saveSessions(); loadSessionToUI();
    }

    async function saveSessions() {
      await set('apexai-sessions', sessions);
      localStorage.setItem('apexai-current-id', currentId);
      renderSessionList();
    }

    function switchSession(id) {
      if (generating) return; currentId = id; localStorage.setItem('apexai-current-id', currentId);
      loadSessionToUI(); renderSessionList(); closeMobileMenu();
    }

    function renderSessionList() {
      const list = document.getElementById('sessionList'); list.innerHTML = '';
      Object.entries(sessions).reverse().forEach(([id, session]) => {
        const div = document.createElement('div'); div.className = `session-item ${id === currentId ? 'active' : ''}`;
        div.innerText = session.title; div.onclick = () => switchSession(id); list.appendChild(div);
      });
    }

    function loadSessionToUI() {
      chatbox.innerHTML = '';
      personaSelect.value = sessions[currentId].persona || 'default';
      customPersonaInput.value = sessions[currentId].customPrompt || '';
      customPersonaInput.style.display = personaSelect.value === 'custom' ? 'block' : 'none';

      if (sessions[currentId].messages.length === 0) {
        chatbox.innerHTML = welcomeHTML; 
        document.querySelectorAll(".prompt").forEach((b) => { b.onclick = () => { input.value = b.textContent.trim(); input.dispatchEvent(new Event('input')); input.focus(); }; });
      } else {
        sessions[currentId].messages.forEach((msg, index) => {
          addMsgToDOM(msg.content, msg.role === 'user' ? 'user' : 'bot', index);
          if (msg.stats && msg.role === 'bot') {
            const statDiv = document.createElement('div'); statDiv.className = 'generation-stats'; statDiv.innerText = msg.stats; chatbox.lastChild.appendChild(statDiv);
          }
        });
      }
      scrollBottom();
    }

    // ---- Web Fetching (Agentic Logic) ----
    async function fetchWebpage(url) {
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json(); const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');
        return doc.body.textContent.replace(/\s+/g, ' ').substring(0, 6000); 
      } catch(e) { return "Error fetching webpage."; }
    }

    // ---- Snippet Library ----
    let snippets = JSON.parse(localStorage.getItem('apexai-snippets')) || [];
    const snippetPanel = document.getElementById('snippetPanel');
    document.getElementById('openSnippetsBtn').onclick = () => snippetPanel.classList.add('open');
    document.getElementById('closeSnippetsBtn').onclick = () => snippetPanel.classList.remove('open');
    document.getElementById('saveNewSnippetBtn').onclick = () => {
      if(!input.value.trim()) return alert("Type code first!");
      const title = prompt("Name this snippet:");
      if(title) { snippets.push({ title, code: input.value.trim() }); localStorage.setItem('apexai-snippets', JSON.stringify(snippets)); renderSnippets(); input.value = ""; }
    };
    function renderSnippets() {
      const list = document.getElementById('snippetList'); list.innerHTML = '';
      snippets.forEach((snip, index) => {
        const card = document.createElement('div'); card.className = 'snippet-card';
        card.innerHTML = `<div class="snippet-header"><span class="snippet-title">${snip.title}</span><button class="snippet-del" data-idx="${index}">✕</button></div><div class="snippet-code">${snip.code}</div>`;
        card.onclick = (e) => {
          if(e.target.classList.contains('snippet-del')) { snippets.splice(e.target.dataset.idx, 1); localStorage.setItem('apexai-snippets', JSON.stringify(snippets)); renderSnippets(); }
          else { input.value = snip.code; input.dispatchEvent(new Event('input')); input.focus(); if(window.innerWidth <= 768) snippetPanel.classList.remove('open'); }
        };
        list.appendChild(card);
      });
    }
    renderSnippets();

    // ---- Renderer ----
    const renderer = new marked.Renderer(); const originalCode = renderer.code.bind(renderer);
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    renderer.code = function(code, language, isEscaped) {
      const highlighted = originalCode(code, language, isEscaped);
      const isHtml = language === 'html' || language === 'xml';
      
      let actions = `<div class="code-actions">`;
      if(isHtml) { actions += `<button class="code-btn preview-btn" data-raw="${escapeHtml(code)}">Preview</button>`; }
      actions += `<button class="code-btn copy-btn">Copy</button></div>`;
      
      return `<div class="code-wrapper">${actions}${highlighted}</div>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, highlight: function(code, lang) { return hljs.highlight(code, { language: hljs.getLanguage(lang) ? lang : 'plaintext' }).value; } });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-btn')) { navigator.clipboard.writeText(e.target.closest('.code-wrapper').querySelector('code').innerText); e.target.innerText = "Copied!"; setTimeout(() => e.target.innerText = "Copy", 2000); }
      if (e.target.classList.contains('preview-btn')) { const txt = document.createElement("textarea"); txt.innerHTML = e.target.getAttribute('data-raw'); document.getElementById('previewFrame').srcdoc = txt.value; document.getElementById('previewModal').classList.add('open'); }
    });
    document.getElementById('closePreview').onclick = () => document.getElementById('previewModal').classList.remove('open');

    // ---- Advanced Exports, Edits & Branching ----
    document.getElementById("exportBtn").addEventListener("click", () => {
      if (sessions[currentId].messages.length === 0) return;
      const format = prompt("Export as: md, html, or py?", "md")?.toLowerCase();
      if (!['md', 'html', 'py'].includes(format)) return;

      let output = ""; let mime = "text/plain";
      if (format === 'md') {
        output = `# ${sessions[currentId].title}\n\n`;
        sessions[currentId].messages.forEach(m => output += `### ${m.role === 'user' ? 'User' : 'ApexAI'}\n${m.content}\n\n---\n\n`);
        mime = "text/markdown";
      } else if (format === 'html') {
        output = `<html><body style="font-family:sans-serif; max-width:800px; margin:auto; padding:20px;"><h1>${sessions[currentId].title}</h1>`;
        sessions[currentId].messages.forEach(m => output += `<div style="background:${m.role==='user'?'#f0f0f0':'#e0f7fa'}; padding:15px; margin-bottom:10px; border-radius:8px;"><strong>${m.role==='user'?'User':'ApexAI'}:</strong><br>${marked.parse(m.content)}</div>`);
        output += `</body></html>`;
        mime = "text/html";
      } else if (format === 'py') {
        output = `# Extracted from ${sessions[currentId].title}\n\n`;
        sessions[currentId].messages.forEach(m => {
          const blocks = m.content.match(/```python[\s\S]*?```/g);
          if(blocks) blocks.forEach(b => output += b.replace(/```python\n|```/g, '') + "\n\n");
        });
        if(!output.trim()) return alert("No Python code found to export.");
      }

      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([output], { type: mime })); a.download = `ApexAI_${sessions[currentId].title.replace(/[^a-z0-9]/gi, '_')}.${format}`; a.click();
    });

    window.editMessage = async function(index) {
      if (generating) return; input.value = sessions[currentId].messages[index].content; input.dispatchEvent(new Event('input')); input.focus();
      sessions[currentId].messages = sessions[currentId].messages.slice(0, index); await saveSessions(); loadSessionToUI();
    };

    window.branchSession = async function(index) {
      if (generating) return;
      const newId = Date.now().toString();
      sessions[newId] = { title: sessions[currentId].title + " (Branch)", messages: sessions[currentId].messages.slice(0, index + 1), persona: sessions[currentId].persona, customPrompt: sessions[currentId].customPrompt };
      await saveSessions(); switchSession(newId);
    };

    // ---- Controls ----
    personaSelect.addEventListener('change', async (e) => { 
      sessions[currentId].persona = e.target.value; 
      customPersonaInput.style.display = e.target.value === 'custom' ? 'block' : 'none';
      await saveSessions(); 
    });
    customPersonaInput.addEventListener('input', async (e) => { sessions[currentId].customPrompt = e.target.value; await saveSessions(); });

    document.getElementById("newChatBtn").addEventListener("click", async () => { if(!generating) { await createNewSession(); closeMobileMenu(); } });
    document.getElementById("clearBtn").addEventListener("click", async () => {
      if(generating) return; delete sessions[currentId]; const keys = Object.keys(sessions);
      currentId = keys.length > 0 ? keys[keys.length - 1] : null; if (!currentId) await createNewSession(); else await saveSessions(); loadSessionToUI(); closeMobileMenu();
    });

    function closeMobileMenu() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("mobileOverlay").classList.remove("open"); }
    document.getElementById("menuToggle").addEventListener("click", () => { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("mobileOverlay").classList.toggle("open"); });
    document.getElementById("mobileOverlay").addEventListener("click", closeMobileMenu);

    // Code Editor behavior for Input (Tab support)
    input.addEventListener('keydown', function(e) {
      if (e.key == 'Tab') {
        e.preventDefault();
        const start = this.selectionStart; const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 2;
      }
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSendAction(); }
    });

    input.addEventListener("input", () => { input.style.height = "26px"; input.style.height = (input.scrollHeight) + "px"; sendBtn.disabled = input.value.trim() === "" || (!ready || generating); });
    sendBtn.addEventListener("click", handleSendAction);

    // Large Document File Drop Handler
    document.body.addEventListener('dragover', (e) => { e.preventDefault(); if(!generating) document.body.classList.add('drag-active'); });
    document.body.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('drag-active'); });
    document.body.addEventListener('drop', (e) => {
      e.preventDefault(); document.body.classList.remove('drag-active');
      if(generating || !ready || !e.dataTransfer.files[0]) return;
      const reader = new FileReader(); 
      reader.onload = (ev) => { 
        const docText = ev.target.result.substring(0, 5000); 
        input.value += (input.value ? "\n\n" : "") + `[Document Contents:\n${docText}\n]`; 
        input.dispatchEvent(new Event('input')); 
      };
      reader.readAsText(e.dataTransfer.files[0]);
    });

    // ---- Execution ----
    async function init() {
      await initDatabase();
      
      // iPad / Safari WebGPU Warning Check
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      if (isSafari && !("gpu" in navigator)) {
         alert("Safari Note: If it stays stuck on 'INITIALIZING', you must enable WebGPU. Go to Settings > Safari > Advanced > Feature Flags > enable 'WebGPU'.");
      }

      if (!("gpu" in navigator)) { setStatus("HARDWARE ERROR", 0); return addMsgToDOM("WebGPU is missing. Access via Chrome or Edge, or enable it in Safari settings.", "bot error", -1); }
      try {
        setStatus("LOADING 0%", 0);
        engine = await webllm.CreateMLCEngine(modelId, { initProgressCallback: (p) => { setStatus(`LOADING ${Math.round((p.progress||0)*100)}%`, Math.round((p.progress||0)*100)); } });
        ready = true; setStatus("ONLINE", 100); input.disabled = false; input.focus();
      } catch (error) { setStatus("OFFLINE", 0); addMsgToDOM("Engine failed to initialize. Ensure WebGPU is active.", "bot error", -1); }
    }

    function handleSendAction() { if (generating && engine && engine.interruptGenerate) { stopRequested = true; engine.interruptGenerate(); } else { sendMessage(); } }
    function setStatus(label, percent) { document.getElementById("status").textContent = label; document.getElementById("progressBar").style.width = `${percent}%`; }
    function scrollBottom() { chatbox.scrollTop = chatbox.scrollHeight; }

    function addMsgToDOM(text, cls, index) {
      const welcomeEl = document.getElementById("welcome"); if (welcomeEl) welcomeEl.remove();
      const container = document.createElement("div"); container.className = `msg-container ${cls}`;
      const msgDiv = document.createElement("div"); msgDiv.className = "msg";
      
      if(cls === "user") {
        msgDiv.textContent = text; container.appendChild(msgDiv);
        if(index !== undefined && index !== -1) {
          const actionsDiv = document.createElement("div"); actionsDiv.className = "msg-actions";
          const editBtn = document.createElement("button"); editBtn.className = "edit-btn"; editBtn.innerText = "✎ Edit"; editBtn.onclick = () => window.editMessage(index);
          actionsDiv.appendChild(editBtn); container.appendChild(actionsDiv);
        }
      } else { 
        msgDiv.innerHTML = marked.parse(text); container.appendChild(msgDiv); 
        if(index !== undefined && index !== -1) {
          const actionsDiv = document.createElement("div"); actionsDiv.className = "msg-actions";
          const branchBtn = document.createElement("button"); branchBtn.className = "edit-btn"; branchBtn.innerText = "⑂ Branch Chat"; branchBtn.onclick = () => window.branchSession(index);
          actionsDiv.appendChild(branchBtn); container.appendChild(actionsDiv);
        }
      }
      chatbox.appendChild(container); scrollBottom(); return msgDiv;
    }

    async function sendMessage() {
      let text = input.value.trim(); if (!text || !ready) return;
      generating = true; stopRequested = false;
      input.value = ""; input.style.height = "26px"; input.disabled = true; 
      sendBtn.innerHTML = "■"; sendBtn.classList.add("stop-mode");

      if (sessions[currentId].messages.length === 0) {
        sessions[currentId].title = text.length > 25 ? text.substring(0, 25) + "..." : text; renderSessionList();
      }

      const userIndex = sessions[currentId].messages.length;
      addMsgToDOM(text, "user", userIndex); 

      let aiPrompt = text;
      if (text.startsWith("/fetch ")) {
        const url = text.split(" ")[1];
        if(url) {
            const botDiv = addMsgToDOM("Fetching website data...", "bot", -1);
            const siteContent = await fetchWebpage(url);
            aiPrompt = `Read this website content:\n\n${siteContent}\n\nUser asked: Summarize or act on the above URL.`;
            botDiv.remove();
        }
      }

      sessions[currentId].messages.push({ role: "user", content: text, aiPrompt: aiPrompt }); await saveSessions();

      const botDiv = addMsgToDOM("Computing sequence...", "bot", -1);
      
      // Determine System Prompt
      let systemPrompt = personas[sessions[currentId].persona] || personas.default;
      if(sessions[currentId].persona === 'custom' && sessions[currentId].customPrompt) {
        systemPrompt = sessions[currentId].customPrompt + " " + CREATOR_RULE;
      }
      
      const chatMessages = [{ role: "system", content: systemPrompt }];
      sessions[currentId].messages.slice(-10).forEach(m => chatMessages.push({role: m.role, content: m.aiPrompt || m.content}));
      
      const startTime = performance.now();

      try {
        let reply = "";
        const chunks = await engine.chat.completions.create({ messages: chatMessages, stream: true, temperature: sessions[currentId].persona === 'creative' ? 0.7 : 0.3 });
        for await (const chunk of chunks) {
          if (stopRequested) break;
          reply += chunk.choices[0]?.delta?.content || "";
          botDiv.innerHTML = marked.parse(reply) || "Processing..."; scrollBottom();
        }

        const endTime = performance.now();
        const finalReply = reply.trim() || (stopRequested ? "Process interrupted." : "No output.");
        botDiv.innerHTML = marked.parse(finalReply);

        const timeSec = ((endTime - startTime) / 1000).toFixed(1);
        const estimatedTokens = Math.round(finalReply.split(/\s+/).length * 1.3);
        const statsStr = `${timeSec}s · ~${(estimatedTokens / timeSec).toFixed(1)} tokens/s`;

        const statDiv = document.createElement('div'); statDiv.className = 'generation-stats'; statDiv.innerText = statsStr;
        botDiv.parentElement.appendChild(statDiv);
        
        // Add branch button dynamically
        const actionsDiv = document.createElement("div"); actionsDiv.className = "msg-actions";
        const branchBtn = document.createElement("button"); branchBtn.className = "edit-btn"; branchBtn.innerText = "⑂ Branch Chat"; branchBtn.onclick = () => window.branchSession(sessions[currentId].messages.length);
        actionsDiv.appendChild(branchBtn); botDiv.parentElement.appendChild(actionsDiv);

        sessions[currentId].messages.push({ role: "assistant", content: finalReply, stats: statsStr }); await saveSessions();
      } catch (error) { 
        console.error(error); botDiv.classList.add("error"); botDiv.textContent = "Error: " + (error.message || "Execution interrupted."); 
      } finally { 
        generating = false; input.disabled = false; sendBtn.innerHTML = "➤"; sendBtn.classList.remove("stop-mode"); input.focus(); scrollBottom(); 
      }
    }
    
    init();
  </script>
</body>
</html>
