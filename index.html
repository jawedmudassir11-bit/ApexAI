<!-- APIEX AI ULTIMATE FEATURES -->
<!-- Paste BEFORE </body> -->
<!-- ========================= -->

<!-- Monaco Editor -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

<!-- xterm terminal -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<!-- Particles Background -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>

<!-- ========================= -->
<!-- APIEX WINDOWS -->
<!-- ========================= -->

<div id="desktopDock">
  <button onclick="toggleWindow('terminalWindow')">💻</button>
  <button onclick="toggleWindow('editorWindow')">📝</button>
  <button onclick="toggleWindow('memoryWindow')">🧠</button>
</div>

<!-- Monaco Editor Window -->
<div class="floatingWindow" id="editorWindow">
  <div class="windowHeader">
    <span>📝 APIEX Editor</span>
    <button onclick="toggleWindow('editorWindow')">✕</button>
  </div>
  <div id="monacoEditor"></div>
</div>

<!-- Terminal Window -->
<div class="floatingWindow" id="terminalWindow">
  <div class="windowHeader">
    <span>💻 APIEX Terminal</span>
    <button onclick="toggleWindow('terminalWindow')">✕</button>
  </div>
  <div id="terminal"></div>
</div>

<!-- AI Memory Window -->
<div class="floatingWindow" id="memoryWindow">
  <div class="windowHeader">
    <span>🧠 AI Memory</span>
    <button onclick="toggleWindow('memoryWindow')">✕</button>
  </div>

  <div style="padding:15px;">
    <input id="memoryKey" placeholder="Memory Key">
    <textarea id="memoryValue" placeholder="Memory Value"></textarea>
    <button onclick="saveMemory()">Save Memory</button>

    <div id="memoryList"></div>
  </div>
</div>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->

<style>

#desktopDock{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(20px);
  padding:12px;
  border-radius:20px;
  z-index:9999;
}

#desktopDock button{
  width:50px;
  height:50px;
  border:none;
  border-radius:14px;
  background:#7c4dff;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.floatingWindow{
  position:fixed;
  top:100px;
  left:100px;
  width:600px;
  height:400px;
  background:#111;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  overflow:hidden;
  z-index:999;
  display:none;
  resize:both;
  backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.windowHeader{
  height:50px;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  cursor:move;
  font-weight:bold;
}

.windowHeader button{
  background:red;
  color:white;
  border:none;
  width:30px;
  height:30px;
  border-radius:8px;
  cursor:pointer;
}

#monacoEditor{
  width:100%;
  height:calc(100% - 50px);
}

#terminal{
  width:100%;
  height:calc(100% - 50px);
  padding:10px;
}

#memoryWindow input,
#memoryWindow textarea{
  width:100%;
  margin-bottom:10px;
  background:#1b1b1b;
  color:white;
  border:1px solid #333;
  border-radius:10px;
  padding:10px;
}

#memoryWindow button{
  background:#7c4dff;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.memoryItem{
  background:#1b1b1b;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

#particles-js{
  position:fixed;
  inset:0;
  z-index:-1;
}

</style>

<!-- ========================= -->
<!-- PARTICLES BACKGROUND -->
<!-- ========================= -->

<div id="particles-js"></div>

<!-- ========================= -->
<!-- APIEX JAVASCRIPT -->
<!-- ========================= -->

<script>

document.title = "APIEX AI";

const particlesScript = () => {
  tsParticles.load("particles-js", {
    particles: {
      number: { value: 80 },
      links: {
        enable: true,
        distance: 150
      },
      move: {
        enable: true,
        speed: 2
      },
      size: {
        value: 3
      }
    }
  });
};

particlesScript();

function toggleWindow(id){
  const el = document.getElementById(id);

  if(el.style.display === "block"){
    el.style.display = "none";
  }else{
    el.style.display = "block";
  }
}

/* ========================= */
/* DRAG WINDOWS */
/* ========================= */

document.querySelectorAll(".floatingWindow").forEach(win => {

  const header = win.querySelector(".windowHeader");

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  header.addEventListener("mousedown", e => {
    dragging = true;

    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
  });

  document.addEventListener("mousemove", e => {
    if(!dragging) return;

    win.style.left = e.clientX - offsetX + "px";
    win.style.top = e.clientY - offsetY + "px";
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
  });

});

/* ========================= */
/* MONACO EDITOR */
/* ========================= */

require.config({
  paths:{
    vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs'
  }
});

require(['vs/editor/editor.main'], function(){

  window.monacoEditor = monaco.editor.create(
    document.getElementById('monacoEditor'),
    {
      value:
`// Welcome to APIEX AI
function hello(){
  console.log("APIEX AI ONLINE");
}`,
      language:'javascript',
      theme:'vs-dark',
      automaticLayout:true,
      minimap:{
        enabled:true
      }
    }
  );

});

/* ========================= */
/* TERMINAL */
/* ========================= */

const term = new Terminal({
  cursorBlink:true
});

term.open(document.getElementById('terminal'));

term.writeln("⚡ APIEX AI TERMINAL");
term.writeln("======================");
term.writeln("Type commands below");
term.write("$ ");

let commandBuffer = "";

term.onData(e => {

  if(e === "\r"){

    handleTerminalCommand(commandBuffer);

    commandBuffer = "";

    term.write("\r\n$ ");

  }else if(e === "\u007F"){

    if(commandBuffer.length > 0){

      commandBuffer = commandBuffer.slice(0,-1);

      term.write("\b \b");

    }

  }else{

    commandBuffer += e;

    term.write(e);

  }

});

function handleTerminalCommand(cmd){

  if(cmd === "help"){

    term.writeln("\r\nCommands:");
    term.writeln("help");
    term.writeln("clear");
    term.writeln("about");

  }else if(cmd === "clear"){

    term.clear();

  }else if(cmd === "about"){

    term.writeln("\r\nAPIEX AI Ultimate Workspace");

  }else{

    term.writeln(`\r\nUnknown command: ${cmd}`);

  }

}

/* ========================= */
/* MEMORY SYSTEM */
/* ========================= */

let aiMemory =
  JSON.parse(localStorage.getItem("apiex-memory")) || {};

function saveMemory(){

  const key =
    document.getElementById("memoryKey").value;

  const value =
    document.getElementById("memoryValue").value;

  if(!key || !value) return;

  aiMemory[key] = value;

  localStorage.setItem(
    "apiex-memory",
    JSON.stringify(aiMemory)
  );

  renderMemory();

}

function renderMemory(){

  const list =
    document.getElementById("memoryList");

  list.innerHTML = "";

  Object.entries(aiMemory).forEach(([k,v]) => {

    const div = document.createElement("div");

    div.className = "memoryItem";

    div.innerHTML = `
      <strong>${k}</strong>
      <p>${v}</p>
    `;

    list.appendChild(div);

  });

}

renderMemory();

/* ========================= */
/* VOICE INPUT */
/* ========================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();

  recognition.continuous = false;

  recognition.lang = "en-US";

  const micBtn =
    document.getElementById("micBtn");

  micBtn.addEventListener("click", () => {

    recognition.start();

    micBtn.innerHTML = "🔴";

  });

  recognition.onresult = e => {

    const text =
      e.results[0][0].transcript;

    document.getElementById(
      "userInput"
    ).value += text;

    micBtn.innerHTML = "🎤";

  };

}

/* ========================= */
/* AI AUTO SAVE */
/* ========================= */

setInterval(() => {

  localStorage.setItem(
    "apiex-editor-backup",
    monacoEditor?.getValue?.() || ""
  );

}, 5000);

/* ========================= */
/* PWA READY */
/* ========================= */

if('serviceWorker' in navigator){

  navigator.serviceWorker.register(
    'sw.js'
  );

}

console.log("⚡ APIEX AI FULLY LOADED");

</script>
