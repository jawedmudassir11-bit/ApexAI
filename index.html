<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>ApexAI | Intelligence Workspace</title>
  <meta name="description" content="ApexAI is a high-performance local browser AI assistant for coding, math, and analysis." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">

  <style>
    :root {
      --bg-main: #0a0b0d;
      --bg-sidebar: #111317;
      --bg-panel: #16191f;
      --accent-glow: #7c4dff;
      --accent-success: #00e676;
      --accent-danger: #ff5252;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f1f3f5;
      --text-muted: #98a2b3;
    }

    /* Light Theme */
    body.theme-light {
      --bg-main: #f8f9fa;
      --bg-sidebar: #ffffff;
      --bg-panel: #f1f3f5;
      --accent-glow: #6200ea;
      --border-color: rgba(0, 0, 0, 0.1);
      --text-main: #212529;
      --text-muted: #495057;
    }

    /* Neon Theme */
    body.theme-neon {
      --bg-main: #050014;
      --bg-sidebar: #0a0026;
      --bg-panel: #150030;
      --accent-glow: #ff00ff;
      --accent-success: #00ffff;
      --border-color: rgba(255, 0, 255, 0.3);
      --text-main: #ffffff;
      --text-muted: #00ffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; height: 100dvh; overflow: hidden; display: flex;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main); -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    input, textarea, select { font-size: 16px !important; }

    /* Custom Logo Styling */
    .logo-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 14px rgba(124, 77, 255, 0.3); }
    .welcome-logo { width: 120px; height: 120px; border-radius: 24px; object-fit: cover; box-shadow: 0 8px 32px rgba(124, 77, 255, 0.4); margin: 0 auto; }

    /* Overlays */
    #dropOverlay { display: none; position: fixed; inset: 0; background: rgba(10, 11, 13, 0.95); z-index: 1000; place-items: center; color: var(--accent-glow); font-size: 24px; font-weight: 600; border: 4px dashed var(--accent-glow); pointer-events: none; }
    body.drag-active #dropOverlay { display: grid; }
    #mobileOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; opacity: 0; transition: opacity 0.3s; }

    /* Layout Elements */
    #mobileHeader { display: none; background: var(--bg-sidebar); padding: max(12px, env(safe-area-inset-top)) 20px 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); z-index: 50; }
    #menuToggle { background: transparent; border: 1px solid var(--accent-glow); color: var(--accent-glow); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }

    #sidebar { width: 280px; min-width: 280px; padding: 24px 20px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; z-index: 100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    
    /* New Snippet Panel */
    #snippetPanel { position: fixed; right: -320px; top: 0; bottom: 0; width: 320px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); z-index: 200; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
    #snippetPanel.open { right: 0; }
    .snippet-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .snippet-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; cursor: pointer; transition: border-color 0.2s; }
    .snippet-card:hover { border-color: var(--accent-glow); }
    .snippet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .snippet-title { font-weight: 600; font-size: 13px; color: var(--text-main); }
    .snippet-del { color: var(--accent-danger); cursor: pointer; font-size: 12px; background: none; border: none; padding: 0; }
    .snippet-code { font-family: monospace; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Live Preview Modal */
    #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; padding: 40px; }
    #previewModal.open { display: flex; flex-direction: column; }
    .preview-header { display: flex; justify-content: space-between; background: var(--bg-sidebar); padding: 12px 20px; border-radius: 12px 12px 0 0; border: 1px solid var(--border-color); border-bottom: none; }
    #closePreview { background: var(--accent-danger); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    #previewFrame { flex: 1; width: 100%; background: white; border: none; border-radius: 0 0 12px 12px; }

    /* Branding & Common */
    .brand { display: flex; align-items: center; gap: 12px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 18px; font-weight: 600; }
    .muted { color: var(--text-muted); font-size: 13px; line-height: 1.5; }
    
    .panel { padding: 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-panel); }
    .status-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #status { color: var(--accent-success); font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .progress { height: 4px; overflow: hidden; border-radius: 2px; background: rgba(128, 128, 128, 0.2); }
    #progressBar { width: 0%; height: 100%; background: var(--accent-glow); transition: width 0.3s; }

    /* Controls */
    .sidebar-controls { display: flex; flex-direction: column; gap: 10px; }
    .custom-select { width: 100%; padding: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; cursor: pointer; font-size: 13px; }
    #customPersonaInput { width: 100%; padding: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 13px; resize: vertical; min-height: 60px; display: none; }
    .btn-primary { background: var(--accent-glow); color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px; transition: background 0.2s; }
    .btn-secondary:hover { background: rgba(128,128,128,0.1); }

    /* Sessions */
    #sessionList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
    #sessionList::-webkit-scrollbar { width: 4px; }
    #sessionList::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 2px; }
    .session-item { padding: 12px; border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--text-muted); transition: background 0.2s, color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-item:hover { background: rgba(128,128,128,0.1); color: var(--text-main); }
    .session-item.active { background: rgba(124, 77, 255, 0.15); color: var(--text-main); border: 1px solid rgba(124, 77, 255, 0.3); }

    .action-row { display: flex; gap: 8px; }
    .action-row button { flex: 1; }
    #clearBtn { border-color: rgba(255, 82, 82, 0.3); color: var(--accent-danger); }
    #clearBtn:hover { background: rgba(255, 82, 82, 0.1); }

    .signature-badge { padding-top: 14px; border-top: 1px solid rgba(128, 128, 128, 0.2); text-align: center; padding-bottom: env(safe-area-inset-bottom); }
    .signature-badge p { font-size: 11px; color: var(--text-muted); }

    /* Main Chat Space */
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-main); height: 100%; position: relative; transition: background 0.3s; }
    #openSnippetsBtn { position: absolute; top: 20px; right: 20px; z-index: 40; padding: 8px 12px; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); cursor: pointer; font-size: 13px; }

    #chatbox { flex: 1; width: min(100%, 840px); margin: 0 auto; padding: 32px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    #chatbox::-webkit-scrollbar { width: 4px; }
    #chatbox::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 2px; }

    .welcome { margin: auto; max-width: 520px; text-align: center; display: grid; gap: 16px; }
    .welcome h2 { font-size: clamp(24px, 6vw, 32px); font-weight: 700; letter-spacing: -0.5px; }
    .prompts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .prompt { padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); background: var(--bg-panel); cursor: pointer; text-align: left; font-size: 13px; transition: border-color 0.2s, background 0.2s; }

    /* Messages */
    .msg-container { display: flex; flex-direction: column; max-width: min(92%, 740px); width: fit-content; }
    .msg-container.user { align-self: flex-end; }
    .msg-container.bot { align-self: flex-start; width: 100%; }

    .msg { padding: 4px 0; overflow-wrap: anywhere; line-height: 1.6; font-size: 15px; }
    .user .msg { background: var(--bg-panel); padding: 12px 18px; border-radius: 16px 16px 2px 16px; border: 1px solid var(--border-color); }
    .error { color: #ff5252; border-color: rgba(255, 82, 82, 0.2); background: rgba(255, 82, 82, 0.05); padding: 12px 16px; border-radius: 8px; }

    .msg-actions { align-self: flex-end; display: flex; gap: 8px; margin-top: 4px; }
    .edit-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: color 0.2s; }
    .edit-btn:hover { color: var(--accent-glow); }
    .generation-stats { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-family: monospace; }

    /* Code Blocks */
    .code-wrapper { position: relative; margin: 12px 0; }
    .code-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10; }
    .code-btn { background: rgba(128,128,128,0.2); border: 1px solid rgba(128,128,128,0.3); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .code-btn:hover { background: rgba(128,128,128,0.4); }
    .preview-btn { background: rgba(124, 77, 255, 0.2); border-color: rgba(124, 77, 255, 0.4); color: var(--text-main); }
    
    .msg pre { background: var(--bg-panel); padding: 16px; padding-top: 44px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-color); margin: 0; }
    .msg code { font-family: "SFMono-Regular", Consolas, monospace; background: rgba(128, 128, 128, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    .msg pre code { background: transparent; padding: 0; }

    /* Input Area */
    #inputArea { padding: 0 24px 32px; background: linear-gradient(transparent, var(--bg-main) 30%); }
    .input-wrap { width: min(100%, 800px); margin: 0 auto; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 16px; display: flex; align-items: flex-end; gap: 12px; background: var(--bg-sidebar); }
    .input-wrap:focus-within { border-color: rgba(124, 77, 255, 0.5); box-shadow: 0 0 0 1px rgba(124, 77, 255, 0.2); }

    #userInput { flex: 1; min-width: 0; height: 26px; max-height: 150px; border: 0; outline: 0; color: var(--text-main); background: transparent; resize: none; font-family: inherit; line-height: 26px; }
    #userInput::placeholder { color: var(--text-muted); }

    .action-icon-btn { width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: color 0.2s, background 0.2s; }
    .action-icon-btn:hover { color: var(--text-main); background: rgba(128,128,128,0.1); }
    .action-icon-btn.listening { color: var(--accent-danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    #sendBtn { width: 32px; height: 32px; min-width: 32px; border: 0; border-radius: 8px; color: #fff; font-size: 14px; cursor: pointer; background: var(--accent-glow); display: grid; place-items: center; margin-bottom: -2px; transition: background 0.2s; }
    #sendBtn.stop-mode { background: var(--accent-danger); border-radius: 50%; }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #mobileHeader { display: flex; }
      #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
      #sidebar.open { transform: translateX(0); }
      #mobileOverlay.open { display: block; opacity: 1; }
      #snippetPanel { width: 100%; right: -100%; }
      #previewModal { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); }
      #chatbox { padding: 20px 16px; }
      .prompts { grid-template-columns: 1fr; }
      #inputArea { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>

      <p>Made by <strong>Mudassir Jawed
