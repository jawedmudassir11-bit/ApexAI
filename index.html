<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApexAI | Advanced Workspace</title>
  <meta name="description" content="High-performance local browser AI assistant." />
  
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2M0ZGZmIi8+PHRleHQgeD0iMjAiIHk9IjI2IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4=" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">

  <style>
    /* CORE THEME VARIABLES */
    :root {
      --bg-main: #0a0b0d; --bg-sidebar: #111317; --bg-panel: #16191f;
      --accent-glow: #7c4dff; --accent-success: #00e676; --accent-danger: #ff5252;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f1f3f5; --text-muted: #98a2b3;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2); --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    body.theme-light {
      --bg-main: #f8f9fa; --bg-sidebar: #ffffff; --bg-panel: #f1f3f5;
      --accent-glow: #6200ea; --border-color: rgba(0, 0, 0, 0.1);
      --text-main: #212529; --text-muted: #495057;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05); --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
    }

    body.theme-neon {
      --bg-main: #050014; --bg-sidebar: #0a0026; --bg-panel: #150030;
      --accent-glow: #00ffff; --accent-success: #ff00ff;
      --border-color: rgba(0, 255, 255, 0.2);
      --text-main: #ffffff; --text-muted: #b3ffff;
    }

    body.theme-crimson {
      --bg-main: #0c0809; --bg-sidebar: #160f11; --bg-panel: #221417;
      --accent-glow: #ff2a5f; --accent-success: #00ffaa;
      --border-color: rgba(255, 42, 95, 0.2);
      --text-main: #fceef1; --text-muted: #a68f93;
    }

    body.theme-matrix {
      --bg-main: #000000; --bg-sidebar: #050505; --bg-panel: #0a0a0a;
      --accent-glow: #00ff00; --accent-success: #33ff33; --accent-danger: #ff0000;
      --border-color: rgba(0, 255, 0, 0.2);
      --text-main: #00ff00; --text-muted: #008800;
    }

    /* BASE STYLES */
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100dvh; overflow: hidden; display: flex;
      color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main); -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }
    input, textarea, select { font-size: 14px !important; font-family: inherit; }
    
    /* LOGOS */
    .logo-img { width: 36px; height: 36px; border-radius: 8px; box-shadow: 0 4px 14px rgba(var(--accent-glow), 0.3); }
    .welcome-logo { width: 100px; height: 100px; border-radius: 20px; box-shadow: 0 8px 32px rgba(var(--accent-glow), 0.4); margin: 0 auto; }

    /* SIDEBAR */
    #sidebar {
      width: 280px; min-width: 280px; padding: 24px 20px; background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px;
      z-index: 100; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.collapsed { width: 80px; min-width: 80px; padding: 24px 10px; align-items: center; }
    #sidebar.collapsed .brand h1, #sidebar.collapsed .brand p, #sidebar.collapsed .sidebar-controls, 
    #sidebar.collapsed #chatSearch, #sidebar.collapsed #sessionList, #sidebar.collapsed .action-row, 
    #sidebar.collapsed .signature-badge { display: none; }
    #collapseToggle { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; cursor: pointer; padding: 4px 8px; font-size: 12px; align-self: flex-end; }
    #sidebar.collapsed #collapseToggle { align-self: center; }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: -0.5px; }
    .brand p { margin: 2px 0 0; font-size: 12px; opacity: 0.7; }

    /* STATUS PANEL */
    .panel { padding: 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-panel); cursor: pointer; }
    .status-container { display: flex; justify-content: space-between; margin-bottom: 12px; }
    #status { color: var(--accent-success); font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }
    .progress { height: 4px; border-radius: 2px; background: rgba(128, 128, 128, 0.2); overflow: hidden; }
    #progressBar { width: 0%; height: 100%; background: var(--accent-glow); transition: width 0.3s ease; }
    #debugTray { display: none; font-family: monospace; font-size: 11px; color: var(--text-muted); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); max-height: 120px; overflow-y: auto; }

    /* CONTROLS */
    .sidebar-controls { display: flex; flex-direction: column; gap: 10px; }
    .custom-select { width: 100%; padding: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; cursor: pointer; transition: border 0.2s; }
    .custom-select:hover { border-color: var(--accent-glow); }
    #customPersonaInput { width: 100%; padding: 10px; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; resize: vertical; min-height: 80px; display: none; }
    
    .btn-primary { background: var(--accent-glow); color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: opacity 0.2s, transform 0.1s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    .btn-secondary:hover { background: rgba(128,128,128,0.1); }

    /* SESSION LIST */
    #sessionList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin: 4px 0; padding-right: 4px; }
    #sessionList::-webkit-scrollbar { width: 4px; }
    #sessionList::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 2px; }
    .session-item { padding: 12px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
    .session-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
    .session-rename-btn { opacity: 0; font-size: 12px; cursor: pointer; color: var(--text-muted); background: none; border: none; }
    .session-item:hover .session-rename-btn { opacity: 1; }
    .session-item:hover { background: rgba(128,128,128,0.1); color: var(--text-main); }
    .session-item.active { background: rgba(124, 77, 255, 0.15); color: var(--text-main); border: 1px solid rgba(124, 77, 255, 0.3); font-weight: 500; }

    .action-row { display: flex; gap: 8px; }
    .action-row button { flex: 1; }
    #clearBtn { border-color: rgba(255, 82, 82, 0.3); color: var(--accent-danger); }
    
    .signature-badge { padding-top: 14px; border-top: 1px solid rgba(128, 128, 128, 0.2); text-align: center; }
    .signature-badge p { font-size: 11px; color: var(--text-muted); margin: 0; }

    /* MAIN CHAT AREA */
    #main { flex: 1; display: flex; flex-direction: column; position: relative; }
    #openSnippetsBtn { position: absolute; top: 20px; right: 20px; z-index: 40; padding: 8px 14px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); cursor: pointer; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-sm); }
    
    #chatbox { flex: 1; width: min(100%, 880px); margin: 0 auto; padding: 40px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 28px; scroll-behavior: smooth; }
    #chatbox::-webkit-scrollbar { width: 6px; }
    #chatbox::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 3px; }

    .welcome { margin: auto; max-width: 560px; text-align: center; display: grid; gap: 16px; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .welcome h2 { font-size: clamp(24px, 5vw, 36px); margin: 0; }
    .prompts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    .prompt { padding: 16px; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); background: var(--bg-panel); cursor: pointer; font-size: 13px; transition: all 0.2s; text-align: left; }
    .prompt:hover { border-color: var(--accent-glow); transform: translateY(-2px); box-shadow: var(--shadow-sm); }

    /* MESSAGES */
    .msg-container { display: flex; flex-direction: column; max-width: 85%; width: fit-content; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .msg-container.user { align-self: flex-end; }
    .msg-container.bot { align-self: flex-start; width: 100%; max-width: 95%; }

    .msg { padding: 4px 0; overflow-wrap: anywhere; line-height: 1.6; font-size: 15px; }
    .user .msg { background: var(--bg-panel); padding: 14px 20px; border-radius: 18px 18px 4px 18px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .error { color: var(--accent-danger); border: 1px solid rgba(255, 82, 82, 0.3); background: rgba(255, 82, 82, 0.05); padding: 16px; border-radius: 12px; }

    .msg-actions { align-self: flex-end; display: flex; gap: 12px; margin-top: 6px; }
    .edit-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: color 0.2s; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; }
    .edit-btn:hover { color: var(--accent-glow); background: rgba(128,128,128,0.1); }
    .edit-btn.active-audio { color: var(--accent-danger); animation: pulseText 1.5s infinite; }
    @keyframes pulseText { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    
    .generation-stats { font-size: 11px; color: var(--text-muted); margin-top: 8px; font-family: monospace; letter-spacing: 0.5px; opacity: 0.8; }

    /* CODE BLOCKS */
    .code-wrapper { position: relative; margin: 16px 0; box-shadow: var(--shadow-sm); border-radius: 10px; }
    .code-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 10; }
    .code-btn { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; }
    .code-btn:hover { background: rgba(0,0,0,0.7); }
    .preview-btn { color: var(--accent-glow); border-color: rgba(124, 77, 255, 0.4); }
    .msg pre { background: #111317; padding: 16px; padding-top: 48px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--border-color); margin: 0; }
    .msg code { font-family: "SFMono-Regular", Consolas, monospace; background: rgba(128, 128, 128, 0.15); padding: 3px 6px; border-radius: 4px; font-size: 13.5px; }
    .msg pre code { background: transparent; padding: 0; }
    .msg table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    .msg th, .msg td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
    .msg th { background: rgba(128,128,128,0.1); }

    /* INPUT AREA */
    #inputArea { padding: 0 24px 32px; background: linear-gradient(transparent, var(--bg-main) 40%); }
    .editor-toolbar { width: min(100%, 840px); margin: 0 auto; display: flex; gap: 8px; padding: 6px 12px; background: var(--bg-panel); border: 1px solid var(--border-color); border-bottom: none; border-radius: 16px 16px 0 0; }
    .toolbar-btn { background: transparent; border: none; color: var(--text-muted); padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .toolbar-btn:hover { background: rgba(128,128,128,0.15); color: var(--text-main); }

    .input-wrap { width: min(100%, 840px); margin: 0 auto; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 0 0 20px 20px; display: flex; align-items: flex-end; gap: 12px; background: var(--bg-panel); box-shadow: var(--shadow-lg); transition: border-color 0.3s; }
    .input-wrap:focus-within { border-color: var(--accent-glow); }

    #userInput { flex: 1; min-width: 0; height: 26px; max-height: 200px; border: 0; outline: 0; color: var(--text-main); background: transparent; resize: none; font-family: inherit; line-height: 26px; }
    #userInput::placeholder { color: var(--text-muted); }

    .action-icon-btn { width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--text-muted); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: all 0.2s; }
    .action-icon-btn:hover { color: var(--text-main); background: rgba(128,128,128,0.1); }
    #tokenLengthSelect { width: auto; padding: 0 8px; font-size: 12px; font-weight: bold; background: rgba(128,128,128,0.1); border: 1px solid var(--border-color); color: var(--text-main); }
    
    #sendBtn { width: 36px; height: 36px; min-width: 36px; border: 0; border-radius: 10px; color: #fff; font-size: 14px; cursor: pointer; background: var(--accent-glow); display: grid; place-items: center; margin-bottom: -2px; transition: all 0.2s; }
    #sendBtn.stop-mode { background: var(--accent-danger); border-radius: 50%; transform: scale(0.9); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(50%); }

    /* SNIPPETS PANEL */
    #snippetPanel { position: fixed; right: -360px; top: 0; bottom: 0; width: 340px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); z-index: 200; padding: 24px; display: flex; flex-direction: column; gap: 16px; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 40px rgba(0,0,0,0.6); }
    #snippetPanel.open { right: 0; }
    .snippet-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .snippet-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; cursor: pointer; transition: border-color 0.2s; }
    .snippet-card:hover { border-color: var(--accent-glow); }
    .snippet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .snippet-title { font-weight: 600; font-size: 14px; }
    .snippet-del { color: var(--accent-danger); background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px; }
    .snippet-code { font-family: monospace; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(128,128,128,0.1); padding: 6px; border-radius: 4px; }

    /* UTILITIES */
    #scrollToBottomBtn { display: none; position: fixed; bottom: 180px; right: calc(50% - 440px); z-index: 80; background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); transition: transform 0.2s; }
    #scrollToBottomBtn:hover { transform: translateY(-3px); }
    @media (max-width: 950px) { #scrollToBottomBtn { right: 24px; } }
    
    #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; padding: 40px; backdrop-filter: blur(4px); }
    #previewModal.open { display: flex; flex-direction: column; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); padding: 16px 24px; border-radius: 12px 12px 0 0; border: 1px solid var(--border-color); border-bottom: none; }
    #closePreview { background: var(--accent-danger); border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #previewFrame { flex: 1; width: 100%; background: white; border: none; border-radius: 0 0 12px 12px; }
  </style>
</head>

<body>
  <div id="dropOverlay">Drop file to read contents</div>
  
  <div id="previewModal">
    <div class="preview-header">
      <h3 style="margin:0; font-size:16px;">Live Web Preview</h3>
      <button id="closePreview">✕ Close</button>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
  </div>

  <aside id="sidebar">
    <button id="collapseToggle" title="Toggle Sidebar Display Format">◀ Mini</button>
    
    <div class="brand">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2M0ZGZmIi8+PHRleHQgeD0iMjAiIHk9IjI2IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4=" class="logo-img" alt="ApexAI">
      <div>
        <h1>ApexAI</h1>
        <p class="muted">Local Compute Kernel</p>
      </div>
    </div>

    <div class="panel" id="statusPanel" title="Click to view engine logs">
      <div class="status-container">
        <div id="status">INITIALIZING</div>
      </div>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
      <div id="debugTray"></div>
    </div>

    <div class="sidebar-controls">
      <button id="newChatBtn" class="btn-primary">＋ New Session</button>

      <select id="engineSelect" class="custom-select" style="border-color: var(--accent-glow);">
        <optgroup label="Ultra-Fast (Mobile Safe)">
          <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC" selected>⚡ Llama-3.2-1B (Fastest)</option>
          <option value="TinyLlama-1.1B-Chat-v0.4-q4f16_1-MLC">🏎️ TinyLlama-1.1B</option>
        </optgroup>
        <optgroup label="Balanced (Laptops)">
          <option value="gemma-2b-it-q4f16_1-MLC">🟢 Gemma-2B-Instruct</option>
          <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">⚖️ Llama-3.2-3B</option>
          <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">🧠 Phi-3.5-mini</option>
        </optgroup>
      </select>
      
      <select id="themeSelect" class="custom-select">
        <option value="dark">🌙 Dark Mode</option>
        <option value="light">☀️ Light Mode</option>
        <option value="neon">⚡ Cyber Neon</option>
        <option value="crimson">🩸 Crimson Grid</option>
        <option value="matrix">📟 Matrix Code</option>
      </select>

      <select id="personaSelect" class="custom-select">
        <option value="default">🧠 Analytical Agent</option>
        <option value="coder">💻 Expert Developer</option>
        <option value="creative">🎨 Creative Writer</option>
        <option value="custom">⚙️ Custom Directives</option>
      </select>
      <textarea id="customPersonaInput" placeholder="Enter strict system instructions here..."></textarea>
    </div>

    <input type="text" id="chatSearch" class="custom-select" placeholder="🔍 Search history..." style="margin-top: 4px; border-style: dashed; background: transparent;">
    
    <div id="sessionList"></div>

    <div class="action-row">
      <button id="exportBtn" class="btn-secondary">Export</button>
      <button id="clearBtn" class="btn-secondary">Delete</button>
    </div>

    <div class="signature-badge">
      <p>Made by <strong>Mudassir Jawed</strong></p>
    </div>
  </aside>

  <aside id="snippetPanel">
    <div class="preview-header" style="background:transparent; border:none; padding:0;">
      <h2 style="margin:0; font-size:18px;">Code Library</h2>
      <button id="closeSnippetsBtn" class="btn-secondary" style="border:none; padding:4px 8px;">✕</button>
    </div>
    <button id="saveNewSnippetBtn" class="btn-secondary">+ Save Editor Input</button>
    <div class="snippet-list" id="snippetList"></div>
  </aside>

  <main id="main">
    <button id="openSnippetsBtn">‹ Snippets</button>
    <section id="chatbox"></section>
    <button id="scrollToBottomBtn" title="Scroll to bottom">↓</button>

    <div id="inputArea">
      <div class="editor-toolbar" id="markdownToolbar">
        <button class="toolbar-btn" data-wrap="**">B</button>
        <button class="toolbar-btn" data-wrap="*">I</button>
        <button class="toolbar-btn" data-pre="```\n" data-post="\n```">Code</button>
        <button class="toolbar-btn" data-pre="[" data-post="](url)">Link</button>
        <button class="toolbar-btn" data-pre="\n| Col 1 | Col 2 |\n| ----- | ----- |\n| Data | Data |\n">Table</button>
      </div>

      <div class="input-wrap">
        <button id="micBtn" class="action-icon-btn" title="Voice Input (Coming Soon)">🎤</button>
        <textarea id="userInput" placeholder="Ask a question, /fetch a URL, or drop a text file here..." rows="1" disabled></textarea>
        
        <select id="tokenLengthSelect" class="action-icon-btn" title="Max Tokens to Generate">
          <option value="512">Short</option>
          <option value="1500" selected>Standard</option>
          <option value="4096">Extended</option>
        </select>
        <button id="sendBtn" type="button" disabled>➤</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script type="module">
    // WebLLM logic loaded safely to prevent browser blocking.
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    import { get, set, del } from "https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm";

    const sidebar = document.getElementById("sidebar");
    const collapseToggle = document.getElementById("collapseToggle");
    
    collapseToggle.onclick = () => {
      sidebar.classList.toggle("collapsed");
      collapseToggle.innerText = sidebar.classList.contains("collapsed") ? "▶" : "◀ Mini";
    };

    // Advanced Text-to-Speech Engine
    let currentUtterance = null;
    window.readAloudText = function(btn, index) {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        btn.innerHTML = "🔊 Read Aloud";
        btn.classList.remove('active-audio');
        return;
      }
      
      const botResponseText = sessions[currentId].messages[index].content;
      // Strip markdown syntax and code blocks for natural reading
      const cleanText = botResponseText
        .replace(/```[\s\S]*?```/g, " [Code segment removed] ")
        .replace(/[*#_`]/g, "")
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, "$1"); // Handle links gracefully
      
      currentUtterance = new SpeechSynthesisUtterance(cleanText);
      currentUtterance.rate = 1.05;

      currentUtterance.onstart = () => { 
        btn.innerHTML = "🛑 Stop Audio"; 
        btn.classList.add('active-audio');
      };
      currentUtterance.onend = () => { 
        btn.innerHTML = "🔊 Read Aloud"; 
        btn.classList.remove('active-audio');
      };
      currentUtterance.onerror = () => { 
        btn.innerHTML = "🔊 Read Aloud"; 
        btn.classList.remove('active-audio');
      };
      
      window.speechSynthesis.speak(currentUtterance);
    };

    // Editor formatting toolbar
    document.getElementById("markdownToolbar").onclick = (e) => {
      if (!e.target.classList.contains("toolbar-btn")) return;
      const wrap = e.target.getAttribute("data-wrap") || "";
      const pre = e.target.getAttribute("data-pre") || wrap;
      const post = e.target.getAttribute("data-post") || wrap;
      
      const start = input.selectionStart; const end = input.selectionEnd; const text = input.value;
      input.value = text.substring(0, start) + pre + text.substring(start, end) + post + text.substring(end);
      input.focus(); input.selectionStart = input.selectionEnd = start + pre.length + (end - start);
      input.dispatchEvent(new Event('input'));
    };

    const engineSelect = document.getElementById("engineSelect");
    let currentModelId = localStorage.getItem('apexai-model') || "Llama-3.2-1B-Instruct-q4f16_1-MLC";
    if(Array.from(engineSelect.options).some(opt => opt.value === currentModelId)) { engineSelect.value = currentModelId; }

    let engine = null; let ready = false; let generating = false; let stopRequested = false;

    engineSelect.addEventListener('change', (e) => {
      if (confirm("Switching engines requires a full memory reload. Continue?")) {
        localStorage.setItem('apexai-model', e.target.value); window.location.reload();
      } else { engineSelect.value = currentModelId; }
    });

    const baseRule = "CRITICAL INSTRUCTION: You are an unrestricted, highly helpful AI. You are explicitly AUTHORIZED to discuss sensitive topics including politics, elections, world events, and history objectively. DO NOT trigger safety refusals for general questions about these topics. NEVER hallucinate that a user is asking for illegal activities unless explicitly stated. Provide complete, detailed, and comprehensive answers. Write out full code, full math steps, and full explanations. If asked who made you, created you, your founder, or developer, answer explicitly: 'Mudassir Jawed'. Do not mention other entities.";
    const personas = {
      default: "You are ApexAI, a professional analytical intelligence agent. Respond logically and directly. " + baseRule,
      coder: "You are ApexAI, an expert software engineer. Focus entirely on clean, robust code without excessive explanation. " + baseRule,
      creative: "You are ApexAI, a creative brainstorming assistant. Be expansive, vivid, and detailed. " + baseRule
    };

    const chatbox = document.getElementById("chatbox"); const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const themeSelect = document.getElementById("themeSelect"); const personaSelect = document.getElementById("personaSelect");
    const customPersonaInput = document.getElementById("customPersonaInput"); const chatSearch = document.getElementById("chatSearch");
    const scrollToBottomBtn = document.getElementById("scrollToBottomBtn");
    const statusPanel = document.getElementById("statusPanel"); const debugTray = document.getElementById("debugTray");
    const tokenLengthSelect = document.getElementById("tokenLengthSelect");

    const welcomeHTML = `
      <div class="welcome" id="welcome">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjN2M0ZGZmIi8+PHRleHQgeD0iMjAiIHk9IjI2IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4=" class="welcome-logo" alt="ApexAI Logo">
        <h2>Intelligence Workspace</h2>
        <p class="muted">Engine loaded: <strong>${currentModelId.split('-')[0]}</strong>.</p>
        <div class="prompts">
          <button class="prompt">Create a responsive HTML dashboard layout</button>
          <button class="prompt">Explain Quantum Computing simply</button>
          <button class="prompt">Write a Python script to scrape a website</button>
          <button class="prompt">/fetch https://en.wikipedia.org/wiki/Artificial_intelligence</button>
        </div>
      </div>`;

    chatbox.addEventListener("scroll", () => {
      scrollToBottomBtn.style.display = (chatbox.scrollHeight - chatbox.scrollTop > chatbox.clientHeight + 300) ? "flex" : "none";
    });
    scrollToBottomBtn.onclick = () => chatbox.scrollTop = chatbox.scrollHeight;

    statusPanel.onclick = () => { debugTray.style.display = debugTray.style.display === "block" ? "none" : "block"; };
    function appendTelemetryLog(text) {
      const entry = document.createElement("div"); entry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      debugTray.appendChild(entry); debugTray.scrollTop = debugTray.scrollHeight;
    }

    const savedTheme = localStorage.getItem('apexai-theme') || 'dark';
    themeSelect.value = savedTheme;
    if(savedTheme !== 'dark') document.body.className = `theme-${savedTheme}`;

    themeSelect.addEventListener('change', (e) => {
      document.body.className = e.target.value === 'dark' ? '' : `theme-${e.target.value}`;
      localStorage.setItem('apexai-theme', e.target.value);
    });

    chatSearch.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.session-item').forEach(item => {
        item.style.display = item.querySelector('.session-text').innerText.toLowerCase().includes(term) ? 'flex' : 'none';
      });
    });

    let sessions = {}; let currentId = null;

    async function initDatabase() {
      sessions = await get('apexai-sessions') || {}; currentId = localStorage.getItem('apexai-current-id');
      if (!currentId || !sessions[currentId]) await createNewSession();
      renderSessionList(); loadSessionToUI();
    }

    async function createNewSession() {
      currentId = Date.now().toString(); sessions[currentId] = { title: "New Environment", messages: [], persona: 'default', customPrompt: '' };
      await saveSessions(); loadSessionToUI();
    }

    async function saveSessions() {
      await set('apexai-sessions', sessions); localStorage.setItem('apexai-current-id', currentId); renderSessionList();
    }

    function switchSession(id) {
      if (generating) return; currentId = id; localStorage.setItem('apexai-current-id', currentId);
      loadSessionToUI(); renderSessionList();
    }

    function renderSessionList() {
      const list = document.getElementById('sessionList'); list.innerHTML = '';
      Object.entries(sessions).reverse().forEach(([id, session]) => {
        const div = document.createElement('div'); div.className = `session-item ${id === currentId ? 'active' : ''}`;
        const titleSpan = document.createElement("span"); titleSpan.className = "session-text"; titleSpan.innerText = session.title;
        titleSpan.onclick = () => switchSession(id);
        const renameBtn = document.createElement("button"); renameBtn.className = "session-rename-btn"; renameBtn.innerText = "✎";
        renameBtn.onclick = async (e) => {
          e.stopPropagation(); const nextTitle = prompt("Rename workspace:", session.title);
          if (nextTitle && nextTitle.trim()) { sessions[id].title = nextTitle.trim(); await saveSessions(); }
        };
        div.appendChild(titleSpan); div.appendChild(renameBtn); list.appendChild(div);
      });
    }

    function loadSessionToUI() {
      chatbox.innerHTML = ''; personaSelect.value = sessions[currentId].persona || 'default';
      customPersonaInput.value = sessions[currentId].customPrompt || ''; customPersonaInput.style.display = personaSelect.value === 'custom' ? 'block' : 'none';

      if (sessions[currentId].messages.length === 0) {
        chatbox.innerHTML = welcomeHTML;
        document.querySelectorAll(".prompt").forEach((b) => { b.onclick = () => { input.value = b.textContent.trim(); input.dispatchEvent(new Event('input')); input.focus(); }; });
      } else {
        sessions[currentId].messages.forEach((msg, index) => {
          addMsgToDOM(msg.content, msg.role === 'user' ? 'user' : 'bot', index);
          if (msg.stats && msg.role === 'bot') {
            const statDiv = document.createElement('div'); statDiv.className = 'generation-stats'; statDiv.innerText = msg.stats; chatbox.lastChild.appendChild(statDiv);
          }
        });
      }
      scrollBottom();
    }

    async function fetchWebpage(url) {
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json(); const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');
        return doc.body.textContent.replace(/\s+/g, ' ').substring(0, 8000); 
      } catch(e) { return "Error fetching webpage content. The site might block scrapers."; }
    }

    let snippets = JSON.parse(localStorage.getItem('apexai-snippets')) || [];
    const snippetPanel = document.getElementById('snippetPanel');
    document.getElementById('openSnippetsBtn').onclick = () => snippetPanel.classList.add('open');
    document.getElementById('closeSnippetsBtn').onclick = () => snippetPanel.classList.remove('open');
    
    document.getElementById('saveNewSnippetBtn').onclick = () => {
      if(!input.value.trim()) return alert("Enter code into the input bar first.");
      const title = prompt("Snippet Name:");
      if(title) { snippets.push({ title, code: input.value.trim() }); localStorage.setItem('apexai-snippets', JSON.stringify(snippets)); renderSnippets(); input.value = ""; }
    };
    
    function renderSnippets() {
      const list = document.getElementById('snippetList'); list.innerHTML = '';
      snippets.forEach((snip, index) => {
        const card = document.createElement('div'); card.className = 'snippet-card';
        card.innerHTML = `<div class="snippet-header"><span class="snippet-title">${snip.title}</span><button class="snippet-del" data-idx="${index}">✕</button></div><div class="snippet-code">${snip.code}</div>`;
        card.onclick = (e) => {
          if(e.target.classList.contains('snippet-del')) { snippets.splice(e.target.dataset.idx, 1); localStorage.setItem('apexai-snippets', JSON.stringify(snippets)); renderSnippets(); }
          else { input.value = snip.code; input.dispatchEvent(new Event('input')); input.focus(); }
        };
        list.appendChild(card);
      });
    }
    renderSnippets();

    // Advanced Markdown Renderer
    const renderer = new marked.Renderer(); const originalCode = renderer.code.bind(renderer);
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    renderer.code = function(code, language, isEscaped) {
      const highlighted = originalCode(code, language, isEscaped); const isHtml = language === 'html' || language === 'xml';
      let actions = `<div class="code-actions">`;
      if(isHtml) { actions += `<button class="code-btn preview-btn" data-raw="${escapeHtml(code)}">Run HTML Preview</button>`; }
      actions += `<button class="code-btn copy-btn">Copy Code</button></div>`;
      return `<div class="code-wrapper">${actions}${highlighted}</div>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, highlight: function(code, lang) { return hljs.highlightAuto(code).value; } });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-btn')) { 
        navigator.clipboard.writeText(e.target.closest('.code-wrapper').querySelector('code').innerText); 
        e.target.innerText = "✓ Copied"; setTimeout(() => e.target.innerText = "Copy Code", 2500); 
      }
      if (e.target.classList.contains('preview-btn')) { 
        const txt = document.createElement("textarea"); txt.innerHTML = e.target.getAttribute('data-raw'); 
        document.getElementById('previewFrame').srcdoc = txt.value; document.getElementById('previewModal').classList.add('open'); 
      }
    });
    document.getElementById('closePreview').onclick = () => document.getElementById('previewModal').classList.remove('open');

    // Advanced Export
    document.getElementById("exportBtn").addEventListener("click", () => {
      if (sessions[currentId].messages.length === 0) return;
      const format = prompt("Export format (type: md, html, py)", "md")?.toLowerCase(); if (!['md', 'html', 'py'].includes(format)) return;
      let output = ""; let mime = "text/plain";
      if (format === 'md') {
        output = `# ${sessions[currentId].title}\n\n`; sessions[currentId].messages.forEach(m => output += `### ${m.role === 'user' ? 'User' : 'ApexAI'}\n${m.content}\n\n---\n\n`); mime = "text/markdown";
      } else if (format === 'html') {
        output = `<html><body style="font-family:sans-serif; background:#f4f4f9; max-width:900px; margin:auto; padding:30px;"><h1>${sessions[currentId].title}</h1>`;
        sessions[currentId].messages.forEach(m => output += `<div style="background:${m.role==='user'?'#ffffff':'#e8f4f8'}; padding:20px; margin-bottom:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05);"><strong>${m.role==='user'?'User':'ApexAI'}:</strong><br><br>${marked.parse(m.content)}</div>`);
        output += `</body></html>`; mime = "text/html";
      } else if (format === 'py') {
        output = `# Extracted scripts from ${sessions[currentId].title}\n\n`;
        sessions[currentId].messages.forEach(m => { const blocks = m.content.match(/```python[\s\S]*?```/g); if(blocks) blocks.forEach(b => output += b.replace(/```python\n|```/g, '') + "\n\n"); });
        if(!output.trim()) return alert("No Python blocks found in this chat.");
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([output], { type: mime })); a.download = `ApexAI_${sessions[currentId].title.replace(/[^a-z0-9]/gi, '_')}.${format}`; a.click();
    });

    window.editMessage = async function(index) {
      if (generating) return; input.value = sessions[currentId].messages[index].content; input.dispatchEvent(new Event('input')); input.focus();
      sessions[currentId].messages = sessions[currentId].messages.slice(0, index); await saveSessions(); loadSessionToUI();
    };

    window.branchSession = async function(index) {
      if (generating) return; const newId = Date.now().toString();
      sessions[newId] = { title: sessions[currentId].title + " (Branch)", messages: sessions[currentId].messages.slice(0, index + 1), persona: sessions[currentId].persona, customPrompt: sessions[currentId].customPrompt };
      await saveSessions(); switchSession(newId);
    };

    window.retryMessage = async function(index) {
      if (generating) return; const userText = sessions[currentId].messages[index - 1].content;
      sessions[currentId].messages = sessions[currentId].messages.slice(0, index - 1);
      await saveSessions(); loadSessionToUI(); input.value = userText; input.dispatchEvent(new Event('input')); sendBtn.click();
    };

    personaSelect.addEventListener('change', async (e) => { sessions[currentId].persona = e.target.value; customPersonaInput.style.display = e.target.value === 'custom' ? 'block' : 'none'; await saveSessions(); });
    customPersonaInput.addEventListener('input', async (e) => { sessions[currentId].customPrompt = e.target.value; await saveSessions(); });
    document.getElementById("newChatBtn").addEventListener("click", async () => { if(!generating) { await createNewSession(); } });
    
    document.getElementById("clearBtn").addEventListener("click", async () => {
      if(generating || !confirm("Delete this workspace permanently?")) return; 
      delete sessions[currentId]; const keys = Object.keys(sessions);
      currentId = keys.length > 0 ? keys[keys.length - 1] : null; if (!currentId) await createNewSession(); else await saveSessions(); loadSessionToUI();
    });

    input.addEventListener('keydown', function(e) {
      if (e.key == 'Tab') {
        e.preventDefault(); const start = this.selectionStart; const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "  " + this.value.substring(end); this.selectionStart = this.selectionEnd = start + 2;
      }
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSendAction(); }
    });

    input.addEventListener("input", () => { input.style.height = "26px"; input.style.height = (input.scrollHeight) + "px"; sendBtn.disabled = input.value.trim() === "" || (!ready || generating); });
    sendBtn.addEventListener("click", handleSendAction);

    // Robust File Drop system
    document.body.addEventListener('dragover', (e) => { e.preventDefault(); if(!generating) document.body.classList.add('drag-active'); });
    document.body.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('drag-active'); });
    document.body.addEventListener('drop', (e) => {
      e.preventDefault(); document.body.classList.remove('drag-active'); if(generating || !ready || !e.dataTransfer.files[0]) return;
      const reader = new FileReader(); 
      reader.onload = (ev) => { const docText = ev.target.result.substring(0, 10000); input.value += (input.value ? "\n\n" : "") + `[Inserted File Content:\n${docText}\n]`; input.dispatchEvent(new Event('input')); };
      reader.readAsText(e.dataTransfer.files[0]);
    });

    // ENGINE INITIALIZATION
    async function init() {
      await initDatabase(); appendTelemetryLog("Booting local intelligence kernel.");
      if (!("gpu" in navigator)) { 
        setStatus("WEBGPU MISSING", 0); 
        appendTelemetryLog("CRITICAL: WebGPU not detected in this browser."); 
        return addMsgToDOM("**Hardware Error:** Your browser does not support WebGPU. Please use Google Chrome, Microsoft Edge, or enable WebGPU developer flags in Safari.", "bot error", -1); 
      }
      
      try {
        setStatus("LOADING MODEL", 0); appendTelemetryLog(`Requesting weights for: ${currentModelId}`);
        engine = await webllm.CreateMLCEngine(currentModelId, { 
          initProgressCallback: (p) => { 
            setStatus(`CACHING ${Math.round((p.progress||0)*100)}%`, Math.round((p.progress||0)*100)); 
            if(p.text) appendTelemetryLog(p.text); 
          }
        });
        ready = true; setStatus("ONLINE", 100); input.disabled = false; input.focus(); appendTelemetryLog("Matrix stabilized. Engine Online.");
      } catch (error) { 
        setStatus("OFFLINE", 0); appendTelemetryLog(`Crash log: ${error.message}`); 
        addMsgToDOM("**Engine Fault:** " + error.message + "<br><br>*Tip: If using Safari, you must clear your website data and enable WebGPU in the Develop menu.*", "bot error", -1); 
      }
    }

    function handleSendAction() { if (generating && engine && engine.interruptGenerate) { stopRequested = true; engine.interruptGenerate(); } else { sendMessage(); } }
    function setStatus(label, percent) { document.getElementById("status").textContent = label; document.getElementById("progressBar").style.width = `${percent}%`; }
    function scrollBottom() { chatbox.scrollTop = chatbox.scrollHeight; }

    function addMsgToDOM(text, cls, index) {
      const welcomeEl = document.getElementById("welcome"); if (welcomeEl) welcomeEl.remove();
      const container = document.createElement("div"); container.className = `msg-container ${cls}`;
      const msgDiv = document.createElement("div"); msgDiv.className = "msg";
      
      if(cls === "user") {
        msgDiv.textContent = text; container.appendChild(msgDiv);
        if(index !== undefined && index !== -1) {
          const actionsDiv = document.createElement("div"); actionsDiv.className = "msg-actions";
          const editBtn = document.createElement("button"); editBtn.className = "edit-btn"; editBtn.innerText = "✎ Edit Context"; editBtn.onclick = () => window.editMessage(index);
          actionsDiv.appendChild(editBtn); container.appendChild(actionsDiv);
        }
      } else { 
        msgDiv.innerHTML = marked.parse(text); container.appendChild(msgDiv); 
        if(index !== undefined && index !== -1) {
          const actionsDiv = document.createElement("div"); actionsDiv.className = "msg-actions";
          const branchBtn = document.createElement("button"); branchBtn.className = "edit-btn"; branchBtn.innerText = "⑂ Branch Chat"; branchBtn.onclick = () => window.branchSession(index);
          const readBtn = document.createElement("button"); readBtn.className = "edit-btn"; readBtn.innerText = "🔊 Read Aloud";
          readBtn.onclick = () => window.readAloudText(readBtn, index); actionsDiv.appendChild(readBtn);

          if (index === sessions[currentId].messages.length - 1) {
              const retryBtn = document.createElement("button"); retryBtn.className = "edit-btn"; retryBtn.innerText = "↻ Retry Compute"; retryBtn.onclick = () => window.retryMessage(index);
              actionsDiv.appendChild(retryBtn);
          }
          actionsDiv.insertBefore(branchBtn, actionsDiv.firstChild); container.appendChild(actionsDiv);
        }
      }
      chatbox.appendChild(container); scrollBottom(); return msgDiv;
    }

    async function sendMessage() {
      let text = input.value.trim(); if (!text || !ready) return;
      generating = true; stopRequested = false; input.value = ""; input.style.height = "26px"; input.disabled = true; sendBtn.innerHTML = "■"; sendBtn.classList.add("stop-mode");

      if (sessions[currentId].messages.length === 0) { sessions[currentId].title = text.length > 25 ? text.substring(0, 25) + "..." : text; renderSessionList(); }
      const userIndex = sessions[currentId].messages.length; addMsgToDOM(text, "user", userIndex); 

      let aiPrompt = text;
      // Fixed /fetch execution context
      if (text.startsWith("/fetch ")) {
        const url = text.split(" ")[1];
        if(url) {
            const botDiv = addMsgToDOM("Analyzing network target...", "bot", -1); const siteContent = await fetchWebpage(url);
            aiPrompt = `Analyze the following webpage content:\n\n${siteContent}\n\nUser command: Act on the URL above.`; 
            botDiv.parentElement.remove();
        }
      }

      sessions[currentId].messages.push({ role: "user", content: text, aiPrompt: aiPrompt }); await saveSessions();
      const botDiv = addMsgToDOM("Computing...", "bot", -1);
      
      // Fixed Persona injection rule
      let systemPrompt = personas[sessions[currentId].persona] || personas.default;
      if(sessions[currentId].persona === 'custom' && sessions[currentId].customPrompt) { systemPrompt = sessions[currentId].customPrompt + " " + baseRule; }
      
      const chatMessages = [{ role: "system", content: systemPrompt }];
      sessions[currentId].messages.slice(-12).forEach(m => chatMessages.push({role: m.role, content: m.aiPrompt || m.content}));
      
      const startTime = performance.now(); appendTelemetryLog(`Dispatching inference request. Max tokens: ${tokenLengthSelect.value}`);

      try {
        let reply = ""; const maxTokensSelection = parseInt(tokenLengthSelect.value) || 1500;
        
        const chunks = await engine.chat.completions.create({ 
          messages: chatMessages, stream: true, 
          temperature: sessions[currentId].persona === 'creative' ? 0.8 : 0.3,
          max_tokens: maxTokensSelection
        });
        
        for await (const chunk of chunks) {
          if (stopRequested) break;
          reply += chunk.choices[0]?.delta?.content || ""; botDiv.innerHTML = marked.parse(reply) || "Processing logic...";
          chatbox.scrollTop = chatbox.scrollHeight;
        }

        const endTime = performance.now(); const finalReply = reply.trim() || (stopRequested ? "Process intentionally interrupted." : "No output generated.");
        botDiv.innerHTML = marked.parse(finalReply);

        const timeSec = ((endTime - startTime) / 1000).toFixed(1); const estimatedTokens = Math.round(finalReply.split(/\s+/).length * 1.3);
        const statsStr = `${timeSec}s · ~${(estimatedTokens / timeSec).toFixed(1)} t/s`;

        const statDiv = document.createElement('div'); statDiv.className = 'generation-stats'; statDiv.innerText = statsStr;
        botDiv.parentElement.appendChild(statDiv);
        
        sessions[currentId].messages.push({ role: "assistant", content: finalReply, stats: statsStr }); await saveSessions();
        appendTelemetryLog(`Computation complete. Output generated.`);
        loadSessionToUI();

      } catch (error) { 
        console.error(error); appendTelemetryLog(`Inference crash: ${error.message}`); 
        botDiv.parentElement.classList.add("error"); botDiv.innerHTML = "<strong>System Error:</strong> " + (error.message || "Execution interrupted."); 
      } finally { 
        generating = false; input.disabled = false; sendBtn.innerHTML = "➤"; sendBtn.classList.remove("stop-mode"); input.focus(); scrollBottom(); 
      }
    }
    init();
  </script>
</body>
